backend = "glx";
vsync = true;

# Dual Kawase Blur
blur-method = "dual_kawase";
blur-strength = 7;          # Try 6-12, higher = more blur

blur-background = true;
blur-background-frame = false;
blur-background-fixed = false;

blur-background-exclude = [
    "_GTK_FRAME_EXTENTS@",
    "class_g = 'Rofi'",
    "class_g = 'dmenu'",
    "class_g = 'polybar'",
    "window_type = 'dock'",
    "window_type = 'desktop'",
];

# Make inactive windows slightly transparent so you can SEE the blur
inactive-opacity = 0.92;     # ← Important!
active-opacity = 1.0;

# Nice extras
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.6;
shadow-offset-x = -10;
shadow-offset-y = -10;

rounded-corners-exclude = ["window_type = 'dock'"];
